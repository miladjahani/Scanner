name: Build EdgePulse Android APK (Go + Flutter)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Run Go Unit Tests & Vet
        working-directory: go_core
        run: |
          go vet ./...
          go test -v -race ./...

      - name: Build Go Native AAR with gomobile
        working-directory: go_core
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          go mod edit -go=1.24
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go mod tidy
          mkdir -p ../android/app/libs
          gomobile bind -v -target=android/arm64,android/arm -androidapi 24 \
            -o ../android/app/libs/edgepulse_core.aar .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Generate Android platform scaffolding
        run: |
          set -e
          mkdir -p /tmp/keep/kotlin/com/edgepulse/scanner
          cp android/app/build.gradle.kts /tmp/keep/app.gradle.kts
          cp android/build.gradle.kts /tmp/keep/root.gradle.kts
          cp android/settings.gradle.kts /tmp/keep/settings.gradle.kts
          cp android/app/src/main/AndroidManifest.xml /tmp/keep/AndroidManifest.xml
          cp android/app/src/main/kotlin/com/edgepulse/scanner/MainActivity.kt /tmp/keep/kotlin/com/edgepulse/scanner/
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create --platforms=android --org com.edgepulse --project-name edgepulse_scanner .
          cp /tmp/keep/app.gradle.kts android/app/build.gradle.kts
          cp /tmp/keep/root.gradle.kts android/build.gradle.kts
          cp /tmp/keep/settings.gradle.kts android/settings.gradle.kts
          cp /tmp/keep/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/keep/kotlin/com/edgepulse/scanner/MainActivity.kt android/app/src/main/kotlin/com/edgepulse/scanner/MainActivity.kt
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          rm -f test/widget_test.dart

      - name: Pin Gradle version and install dependencies
        run: |
          sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip|' \
            android/gradle/wrapper/gradle-wrapper.properties
          flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze --no-fatal-infos lib

      - name: Build Release APKs (Split per ABI + Universal)
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EdgePulse-Scanner-APKs
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Publish APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          fail_on_unmatched_files: true
