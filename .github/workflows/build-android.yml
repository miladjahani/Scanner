name: Build EdgePulse Android APK (Go + Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Run Go Unit Tests & Vet
        working-directory: go_core
        run: |
          go vet ./...
          go test -v -race ./...

      - name: Build Go Native AAR with gomobile
        working-directory: go_core
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          mkdir -p ../android/app/libs
          gomobile bind -v -target=android/arm64,android/arm -androidapi 24 \
            -o ../android/app/libs/edgepulse_core.aar .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Ensure Android Embedding Files & Analyze
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Build Release APKs (Split per ABI + Universal)
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EdgePulse-Scanner-APKs
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30
